<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f3efe4;
    }
    canvas { display: block; width: 1200px; height: 630px; }
  </style>
</head>
<body>
  <canvas id="c" width="1200" height="630"></canvas>
  <script>
    const W = 1200, H = 630;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    const avatar = new Image();
    avatar.src = "../assets/avatar.png";

    // Calm journey ring — agent-leaning labels, plenty of air
    const islands = [
      { label: "Search", angle: -Math.PI * 0.55, color: "#d8e2ec" },
      { label: "Agents", angle: -Math.PI * 0.12, color: "#e6dfc4" },
      { label: "Memory", angle: Math.PI * 0.28, color: "#e2d6c6" },
      { label: "Tools", angle: Math.PI * 0.68, color: "#d9e6d5" },
      { label: "Infra", angle: Math.PI * 1.08, color: "#e8dcc8" }
    ];

    const clouds = [
      { x: 710, y: 86, s: 1.05, laps: 1 },
      { x: 990, y: 155, s: 0.75, laps: 1 },
      { x: 790, y: 505, s: 0.95, laps: 1 },
      { x: 1090, y: 405, s: 0.7, laps: 1 }
    ];

    // Fewer, slower packets — quiet motion, not busy
    const packets = Array.from({ length: 4 }, (_, i) => ({
      edge: i % islands.length,
      t: i / 4,
      laps: 1
    }));

    function lerp(a, b, t) { return a + (b - a) * t; }
    function mix(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }

    function skyColors(phase) {
      // Gentle cream drift — no heavy dusk punch
      const stops = [
        { top: [248, 245, 236], bot: [240, 232, 214] },
        { top: [246, 238, 220], bot: [236, 222, 196] },
        { top: [242, 230, 208], bot: [228, 210, 180] },
        { top: [246, 238, 220], bot: [236, 222, 196] },
        { top: [248, 245, 236], bot: [240, 232, 214] }
      ];
      const seg = phase * (stops.length - 1);
      const i = Math.floor(seg);
      const t = seg - i;
      const a = stops[i];
      const b = stops[Math.min(i + 1, stops.length - 1)];
      return {
        top: mix(a.top, b.top, t),
        bot: mix(a.bot, b.bot, t)
      };
    }

    function rgb(arr, a = 1) {
      return `rgba(${arr[0] | 0},${arr[1] | 0},${arr[2] | 0},${a})`;
    }

    function islandPos(island, t) {
      const cx = 870, cy = 320;
      const bob = Math.sin(t * Math.PI * 2 + island.angle * 2) * 7;
      const breath = 1 + Math.sin(t * Math.PI * 2 + island.angle) * 0.018;
      return {
        x: cx + Math.cos(island.angle) * 168 * breath,
        y: cy + Math.sin(island.angle) * 122 * breath + bob
      };
    }

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCloud(x, y, s, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 46, 17, 0, 0, Math.PI * 2);
      ctx.ellipse(-28, 4, 26, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(30, 3, 24, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(-6, -10, 20, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawIsland(p, island) {
      const w = 100, h = 58;
      ctx.save();
      ctx.translate(p.x, p.y);

      ctx.fillStyle = "rgba(40, 30, 18, 0.1)";
      ctx.beginPath();
      ctx.ellipse(0, 26, 40, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, "#fffdf8");
      g.addColorStop(1, island.color);
      ctx.fillStyle = g;
      roundRectPath(-w / 2, -h / 2, w, h, 16);
      ctx.fill();

      ctx.fillStyle = "rgba(31, 27, 22, 0.12)";
      roundRectPath(-30, -10, 24, 7, 3); ctx.fill();
      roundRectPath(-2, -10, 16, 7, 3); ctx.fill();
      roundRectPath(18, -10, 14, 7, 3); ctx.fill();
      roundRectPath(-30, 2, 40, 7, 3); ctx.fill();

      ctx.fillStyle = "rgb(31, 27, 22)";
      ctx.font = "700 16px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(island.label, 0, 18);

      ctx.restore();
    }

    function drawBridge(a, b) {
      ctx.strokeStyle = "rgba(90, 74, 52, 0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2 - 18;
      ctx.quadraticCurveTo(mx, my, b.x, b.y);
      ctx.stroke();
    }

    function pointOnBridge(a, b, t) {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2 - 18;
      const u = 1 - t;
      return {
        x: u * u * a.x + 2 * u * t * mx + t * t * b.x,
        y: u * u * a.y + 2 * u * t * my + t * t * b.y
      };
    }

    function drawAvatar(t) {
      const cx = 870, cy = 320;
      const bob = Math.sin(t * Math.PI * 2) * 5;
      ctx.save();
      ctx.translate(cx, cy + bob);

      ctx.fillStyle = "rgba(40, 30, 18, 0.12)";
      ctx.beginPath();
      ctx.ellipse(0, 56, 46, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 54, 0, Math.PI * 2);
      ctx.fillStyle = "#fbf8ef";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(6, 69, 173, 0.35)";
      ctx.stroke();

      if (avatar.complete && avatar.naturalWidth) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(avatar, -48, -48, 96, 96);
        ctx.restore();
      }

      ctx.restore();
    }

    function drawSun(phase) {
      const ang = phase * Math.PI * 2 - Math.PI / 2;
      const sx = 870 + Math.cos(ang) * 250;
      const sy = 320 + Math.sin(ang) * 170;
      // Soft warm glow only — never a harsh disc in your face
      const elev = (Math.sin(ang) + 1) / 2; // 0 bottom .. 1 top
      const alpha = 0.25 + elev * 0.35;
      const grd = ctx.createRadialGradient(sx, sy, 2, sx, sy, 48);
      grd.addColorStop(0, `rgba(255, 210, 120, ${alpha})`);
      grd.addColorStop(1, "rgba(255, 210, 120, 0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(sx, sy, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 196, 90, ${alpha * 0.85})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawText() {
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "rgb(90, 82, 70)";
      ctx.font = "600 22px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("da", 64, 78);

      ctx.fillStyle = "rgb(31, 27, 22)";
      ctx.font = "700 54px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Dhruv Arya", 64, 250);

      ctx.fillStyle = "rgb(90, 82, 70)";
      ctx.font = "500 24px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Search, ML, and agents.", 64, 298);

      ctx.font = "500 20px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("drva.dev", 64, 560);
    }

    window.__render = function (frame, totalFrames) {
      const t = frame / totalFrames;
      const sky = skyColors(t);

      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, rgb(sky.top));
      bg.addColorStop(1, rgb(sky.bot));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      drawSun(t);

      for (const c of clouds) {
        const span = 560;
        const x = 620 + ((c.x - 620 + t * c.laps * span) % span + span) % span;
        drawCloud(x, c.y + Math.sin(t * Math.PI * 2 + c.x) * 4, c.s, 0.5);
      }

      const positions = islands.map((island) => islandPos(island, t));
      for (let i = 0; i < positions.length; i++) {
        drawBridge(positions[i], positions[(i + 1) % positions.length]);
      }

      for (const pkt of packets) {
        const a = positions[pkt.edge];
        const b = positions[(pkt.edge + 1) % positions.length];
        const pt = pointOnBridge(a, b, (pkt.t + t * pkt.laps) % 1);
        ctx.beginPath();
        ctx.fillStyle = "rgba(6, 69, 173, 0.45)";
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      const order = positions.map((p, i) => ({ p, i })).sort((a, b) => a.p.y - b.p.y);
      for (const { p, i } of order) {
        drawIsland(p, islands[i]);
      }

      drawAvatar(t);
      drawText();
    };

    let f = 0;
    const TOTAL = 300;
    function tick() {
      if (window.__capturing) return;
      window.__render(f % TOTAL, TOTAL);
      f++;
      requestAnimationFrame(tick);
    }

    window.__ready = false;
    function markReady() {
      window.__ready = true;
      if (!window.__capturing) tick();
    }
    avatar.onload = markReady;
    avatar.onerror = markReady;
    if (avatar.complete) markReady();
  </script>
</body>
</html>
