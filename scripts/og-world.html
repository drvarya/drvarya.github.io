<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f3efe4;
    }
    canvas { display: block; width: 1200px; height: 630px; }
  </style>
</head>
<body>
  <canvas id="c" width="1200" height="630"></canvas>
  <script>
    const W = 1200, H = 630;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    const avatar = new Image();
    avatar.src = "../assets/avatar.png";

    // Short bold labels only — readable even tiny in iMessage
    const islands = [
      { label: "Penn", angle: -Math.PI * 0.55, color: "#e8dcc4" },
      { label: "Search", angle: -Math.PI * 0.15, color: "#d5e0ec" },
      { label: "AI", angle: Math.PI * 0.25, color: "#d8e6d4" },
      { label: "Infra", angle: Math.PI * 0.65, color: "#ead7c4" },
      { label: "Agents", angle: Math.PI * 1.05, color: "#e9dfb8" }
    ];

    const clouds = [
      { x: 700, y: 78, s: 1.15, sp: 18 },
      { x: 980, y: 150, s: 0.85, sp: 12 },
      { x: 780, y: 500, s: 1.05, sp: 15 },
      { x: 1080, y: 400, s: 0.75, sp: 10 }
    ];

    const packets = Array.from({ length: 8 }, (_, i) => ({
      edge: i % islands.length,
      t: i / 8,
      speed: 0.12 + (i % 3) * 0.03
    }));

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function mix(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }

    function skyColors(phase) {
      // Morning cream → warm golden hour → soft dusk → morning (seamless)
      const stops = [
        { top: [248, 245, 236], bot: [238, 228, 206], night: 0.0 },
        { top: [244, 228, 196], bot: [224, 196, 154], night: 0.25 },
        { top: [196, 168, 132], bot: [148, 122, 96], night: 0.72 },
        { top: [244, 228, 196], bot: [224, 196, 154], night: 0.25 },
        { top: [248, 245, 236], bot: [238, 228, 206], night: 0.0 }
      ];
      const seg = phase * (stops.length - 1);
      const i = Math.floor(seg);
      const t = seg - i;
      const a = stops[i];
      const b = stops[Math.min(i + 1, stops.length - 1)];
      return {
        top: mix(a.top, b.top, t),
        bot: mix(a.bot, b.bot, t),
        nightness: lerp(a.night, b.night, t)
      };
    }

    function rgb(arr, a = 1) {
      return `rgba(${arr[0] | 0},${arr[1] | 0},${arr[2] | 0},${a})`;
    }

    // Stay dark for the whole loop — sky never goes true-night, so light text disappears.
    function ink(_nightness) {
      return "rgb(31, 27, 22)";
    }

    function mute(_nightness) {
      return "rgb(90, 82, 70)";
    }

    function islandPos(island, t) {
      const cx = 860, cy = 325;
      // Fixed layout + bob/breath only so the 10s loop is seamless (like nikunjk.com)
      const bob = Math.sin(t * Math.PI * 2 * 2 + island.angle * 3) * 14;
      const breath = 1 + Math.sin(t * Math.PI * 2 + island.angle) * 0.035;
      return {
        x: cx + Math.cos(island.angle) * 175 * breath,
        y: cy + Math.sin(island.angle) * 128 * breath + bob
      };
    }

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCloud(x, y, s, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 48, 18, 0, 0, Math.PI * 2);
      ctx.ellipse(-30, 4, 28, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(32, 3, 26, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(-6, -11, 22, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawIsland(p, island, nightness) {
      const w = 108, h = 64;
      ctx.save();
      ctx.translate(p.x, p.y);

      ctx.fillStyle = `rgba(40, 30, 18, ${0.14 + nightness * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(0, 30, 44, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, "#fffdf7");
      g.addColorStop(1, island.color);
      ctx.fillStyle = g;
      roundRectPath(-w / 2, -h / 2, w, h, 18);
      ctx.fill();

      // Simple glyph row — texture, not tiny text
      ctx.fillStyle = `rgba(31, 27, 22, ${0.14 + nightness * 0.1})`;
      roundRectPath(-34, -12, 28, 8, 3); ctx.fill();
      roundRectPath(-2, -12, 18, 8, 3); ctx.fill();
      roundRectPath(20, -12, 16, 8, 3); ctx.fill();
      roundRectPath(-34, 2, 48, 8, 3); ctx.fill();
      roundRectPath(18, 2, 18, 8, 3); ctx.fill();

      ctx.fillStyle = ink(nightness * 0.9);
      ctx.font = "700 18px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(island.label, 0, 22);

      ctx.restore();
    }

    function drawBridge(a, b, nightness) {
      ctx.strokeStyle = `rgba(90, 74, 52, ${0.3 + nightness * 0.15})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2 - 22;
      ctx.quadraticCurveTo(mx, my, b.x, b.y);
      ctx.stroke();
    }

    function pointOnBridge(a, b, t) {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2 - 22;
      const u = 1 - t;
      return {
        x: u * u * a.x + 2 * u * t * mx + t * t * b.x,
        y: u * u * a.y + 2 * u * t * my + t * t * b.y
      };
    }

    function drawAvatar(t, nightness) {
      const cx = 860, cy = 325;
      const bob = Math.sin(t * Math.PI * 2) * 10;
      ctx.save();
      ctx.translate(cx, cy + bob);

      ctx.fillStyle = `rgba(40, 30, 18, ${0.16 + nightness * 0.1})`;
      ctx.beginPath();
      ctx.ellipse(0, 62, 52, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // halo
      ctx.beginPath();
      ctx.arc(0, 0, 58, 0, Math.PI * 2);
      ctx.fillStyle = "#fbf8ef";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(6, 69, 173, ${0.4 + nightness * 0.2})`;
      ctx.stroke();

      if (avatar.complete && avatar.naturalWidth) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, 52, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(avatar, -52, -52, 104, 104);
        ctx.restore();
      }

      ctx.restore();
    }

    function drawSunMoon(phase, nightness) {
      const ang = phase * Math.PI * 2 - Math.PI / 2;
      const sx = 860 + Math.cos(ang) * 265;
      const sy = 325 + Math.sin(ang) * 185;
      const sunA = 1 - nightness;
      const moonA = nightness;

      if (sunA > 0.04) {
        const grd = ctx.createRadialGradient(sx, sy, 2, sx, sy, 54);
        grd.addColorStop(0, `rgba(255, 210, 110, ${0.95 * sunA})`);
        grd.addColorStop(1, `rgba(255, 210, 110, 0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(sx, sy, 54, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 188, 72, ${sunA})`;
        ctx.beginPath();
        ctx.arc(sx, sy, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      if (moonA > 0.04) {
        const mx = 860 + Math.cos(ang + Math.PI) * 265;
        const my = 325 + Math.sin(ang + Math.PI) * 185;
        const grd = ctx.createRadialGradient(mx, my, 2, mx, my, 44);
        grd.addColorStop(0, `rgba(255, 248, 230, ${0.75 * moonA})`);
        grd.addColorStop(1, `rgba(255, 248, 230, 0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(mx, my, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(247, 238, 214, ${moonA})`;
        ctx.beginPath();
        ctx.arc(mx, my, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawText(nightness) {
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = mute(nightness);
      ctx.font = "600 22px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("da", 64, 78);

      ctx.fillStyle = ink(nightness);
      ctx.font = "700 54px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Dhruv Arya", 64, 250);

      ctx.fillStyle = mute(nightness);
      ctx.font = "500 24px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Search, ML, and agents.", 64, 298);

      ctx.font = "500 20px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("drva.dev", 64, 560);
    }

    window.__render = function (frame, totalFrames) {
      const t = frame / totalFrames;
      const sky = skyColors(t);
      const nightness = sky.nightness;

      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, rgb(sky.top));
      bg.addColorStop(1, rgb(sky.bot));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // subtle atmosphere speckles
      ctx.fillStyle = `rgba(82, 76, 64, ${0.045 + nightness * 0.05})`;
      for (let i = 0; i < 48; i++) {
        const x = (i * 97 + t * 90) % W;
        const y = (i * 53 + 18) % H;
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      drawSunMoon(t, nightness);

      for (const c of clouds) {
        const span = 560;
        const x = 620 + ((c.x - 620 + t * c.sp * 28) % span + span) % span;
        drawCloud(x, c.y + Math.sin(t * Math.PI * 2 + c.x) * 6, c.s, 0.62 - nightness * 0.2);
      }

      const positions = islands.map((island) => islandPos(island, t));
      for (let i = 0; i < positions.length; i++) {
        drawBridge(positions[i], positions[(i + 1) % positions.length], nightness);
      }

      for (const pkt of packets) {
        const a = positions[pkt.edge];
        const b = positions[(pkt.edge + 1) % positions.length];
        const pt = pointOnBridge(a, b, (pkt.t + t * pkt.speed) % 1);
        ctx.beginPath();
        ctx.fillStyle = `rgba(6, 69, 173, ${0.7 + nightness * 0.15})`;
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // paint far islands first (by y)
      const order = positions.map((p, i) => ({ p, i })).sort((a, b) => a.p.y - b.p.y);
      for (const { p, i } of order) {
        drawIsland(p, islands[i], nightness);
      }

      drawAvatar(t, nightness);
      drawText(nightness);
    };

    let f = 0;
    const TOTAL = 300;
    function tick() {
      if (window.__capturing) return;
      window.__render(f % TOTAL, TOTAL);
      f++;
      requestAnimationFrame(tick);
    }

    window.__ready = false;
    function markReady() {
      window.__ready = true;
      if (!window.__capturing) tick();
    }
    avatar.onload = markReady;
    avatar.onerror = markReady;
    if (avatar.complete) markReady();
  </script>
</body>
</html>
