<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG Agents v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3efe4; }
    canvas { display: block; width: 1200px; height: 630px; }
  </style>
</head>
<body>
  <canvas id="c" width="1200" height="630"></canvas>
  <script>
    const W = 1200, H = 630;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const avatar = new Image();
    avatar.src = "../assets/avatar.png";

    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Tool stations around an orchestrator — the agent metaphor
    const tools = [
      { id: "search", label: "Search", x: 720, y: 150, color: "#c9d7e8" },
      { id: "memory", label: "Memory", x: 980, y: 190, color: "#e4d5c4" },
      { id: "tools", label: "Tools", x: 1020, y: 380, color: "#d8e6d4" },
      { id: "plan", label: "Plan", x: 780, y: 470, color: "#e8dcc4" }
    ];

    // Agents that circulate: hub → tool → hub (integer laps = seamless)
    const agents = [
      { tool: 0, phase: 0.00, laps: 1, hue: "#0645ad", name: "A1" },
      { tool: 1, phase: 0.25, laps: 1, hue: "#2a6f4e", name: "A2" },
      { tool: 2, phase: 0.50, laps: 1, hue: "#8a5a2b", name: "A3" },
      { tool: 3, phase: 0.75, laps: 1, hue: "#5a3596", name: "A4" }
    ];

    const hub = { x: 860, y: 310 };

    function sky(t) {
      const k = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 - Math.PI / 2);
      const topR = lerp(248, 232, k * 0.35);
      const topG = lerp(245, 214, k * 0.35);
      const topB = lerp(236, 188, k * 0.35);
      const botR = lerp(238, 210, k * 0.35);
      const botG = lerp(228, 190, k * 0.35);
      const botB = lerp(206, 160, k * 0.35);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, `rgb(${topR|0},${topG|0},${topB|0})`);
      g.addColorStop(1, `rgb(${botR|0},${botG|0},${botB|0})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function leftCopy() {
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "rgb(90,82,70)";
      ctx.font = "600 22px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("da", 64, 78);

      ctx.fillStyle = "rgb(31,27,22)";
      ctx.font = "700 54px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Dhruv Arya", 64, 240);

      ctx.fillStyle = "rgb(90,82,70)";
      ctx.font = "500 24px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("Agents, search, and infra.", 64, 288);

      ctx.font = "500 20px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.fillText("drva.dev", 64, 560);
    }

    function drawStation(tool, t) {
      const bob = Math.sin(t * Math.PI * 2 * 2 + tool.x * 0.01) * 5;
      const x = tool.x;
      const y = tool.y + bob;
      const w = 118, h = 70;

      ctx.fillStyle = "rgba(40,30,18,0.12)";
      ctx.beginPath();
      ctx.ellipse(x, y + 38, 48, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const g = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
      g.addColorStop(0, "#fffdf7");
      g.addColorStop(1, tool.color);
      ctx.fillStyle = g;
      roundRect(x - w / 2, y - h / 2, w, h, 16);
      ctx.fill();

      // mini UI chrome
      ctx.fillStyle = "rgba(31,27,22,0.14)";
      roundRect(x - 42, y - 18, 84, 8, 3); ctx.fill();
      roundRect(x - 42, y - 4, 52, 8, 3); ctx.fill();
      roundRect(x + 16, y - 4, 26, 8, 3); ctx.fill();

      ctx.fillStyle = "rgb(31,27,22)";
      ctx.font = "700 16px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tool.label, x, y + 20);
    }

    function drawHub(t) {
      const bob = Math.sin(t * Math.PI * 2) * 6;
      const x = hub.x;
      const y = hub.y + bob;

      // orchestrator glow rings
      for (let i = 0; i < 3; i++) {
        const pulse = 1 + Math.sin(t * Math.PI * 2 * 2 + i) * 0.04;
        ctx.beginPath();
        ctx.arc(x, y, (58 + i * 16) * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(6,69,173,${0.22 - i * 0.05})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(40,30,18,0.14)";
      ctx.beginPath();
      ctx.ellipse(x, y + 58, 50, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, 52, 0, Math.PI * 2);
      ctx.fillStyle = "#fbf8ef";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(6,69,173,0.55)";
      ctx.stroke();

      if (avatar.complete && avatar.naturalWidth) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 46, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(avatar, x - 46, y - 46, 92, 92);
        ctx.restore();
      }

      // small "orchestrator" caption
      ctx.fillStyle = "rgb(90,82,70)";
      ctx.font = "600 13px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("orchestrator", x, y + 78);
    }

    function pathPoint(tool, u) {
      // u: 0..1 out to tool, 1..2 back to hub  → normalize to 0..1 cycle with out+back
      // return position along outbound (0-0.5) or inbound (0.5-1)
      const out = u < 0.5;
      const p = out ? u / 0.5 : (u - 0.5) / 0.5;
      const eased = p * p * (3 - 2 * p);
      const from = out ? hub : tool;
      const to = out ? tool : hub;
      // slight arc
      const mx = (hub.x + tool.x) / 2;
      const my = (hub.y + tool.y) / 2 - 28;
      const t = eased;
      const x = (1 - t) * (1 - t) * from.x + 2 * (1 - t) * t * mx + t * t * to.x;
      const y = (1 - t) * (1 - t) * from.y + 2 * (1 - t) * t * my + t * t * to.y;
      return { x, y, outbound: out };
    }

    function drawRoutes(t) {
      for (const tool of tools) {
        ctx.beginPath();
        ctx.moveTo(hub.x, hub.y);
        const mx = (hub.x + tool.x) / 2;
        const my = (hub.y + tool.y) / 2 - 28;
        ctx.quadraticCurveTo(mx, my, tool.x, tool.y);
        ctx.strokeStyle = "rgba(90,74,52,0.28)";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -t * 40;
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function drawAgent(agent, t) {
      const tool = tools[agent.tool];
      const u = (agent.phase + t * agent.laps) % 1;
      const p = pathPoint(tool, u);

      // task chip trailing while outbound
      if (p.outbound && u > 0.08 && u < 0.45) {
        ctx.fillStyle = "#f7f4ea";
        roundRect(p.x - 28, p.y - 28, 56, 18, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(31,27,22,0.65)";
        ctx.font = "600 10px 'IBM Plex Sans', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("task", p.x, p.y - 15);
      }

      // result chip while inbound
      if (!p.outbound && u > 0.55 && u < 0.92) {
        ctx.fillStyle = "#eef4ea";
        roundRect(p.x - 30, p.y - 28, 60, 18, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(42,111,78,0.85)";
        ctx.font = "600 10px 'IBM Plex Sans', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("result", p.x, p.y - 15);
      }

      // agent body
      ctx.beginPath();
      ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = agent.hue;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#f7f4ea";
      ctx.stroke();

      // eye / antenna dot
      ctx.beginPath();
      ctx.arc(p.x, p.y - 14, 3, 0, Math.PI * 2);
      ctx.fillStyle = agent.hue;
      ctx.fill();
    }

    // Ambient “context tokens” orbiting the hub
    function drawContextTokens(t) {
      for (let i = 0; i < 8; i++) {
        const ang = t * Math.PI * 2 + (i / 8) * Math.PI * 2;
        const r = 100 + (i % 3) * 8;
        const x = hub.x + Math.cos(ang) * r;
        const y = hub.y + Math.sin(ang) * r * 0.55;
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(6,69,173,${0.25 + (i % 3) * 0.1})`;
        ctx.fill();
      }
    }

    window.__render = function (frame, total) {
      const t = frame / total;
      sky(t);
      leftCopy();
      drawRoutes(t);
      drawContextTokens(t);
      for (const tool of tools) drawStation(tool, t);
      drawHub(t);
      for (const agent of agents) drawAgent(agent, t);

      // legend
      ctx.fillStyle = "rgb(90,82,70)";
      ctx.font = "500 13px 'IBM Plex Sans', system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("multi-agent loop", 700, 560);
    };

    let f = 0;
    function tick() {
      if (window.__capturing) return;
      window.__render(f % 300, 300);
      f++;
      requestAnimationFrame(tick);
    }

    window.__ready = false;
    function markReady() {
      window.__ready = true;
      if (!window.__capturing) tick();
    }
    avatar.onload = markReady;
    avatar.onerror = markReady;
    if (avatar.complete) markReady();
  </script>
</body>
</html>
