<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Search posts by Dhruv Arya">
    <title>Search | Dhruv Arya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <p><a href="/">Dhruv Arya</a></p>
        <nav aria-label="Site links">
          <a href="/">Home</a>
          <a href="/blog/">Blog</a>
        </nav>
      </header>

      <section class="intro">
        <h1>Search</h1>
        <p>Search post titles, descriptions, and Markdown content.</p>
        <label class="search-box">
          <span>Search posts</span>
          <input id="search-input" type="search" placeholder="debugging, APIs, systems">

      <section class="list-section" aria-labelledby="results-title">
        <h2 id="results-title">Results:</h2>
        <ul class="link-list" id="search-results">
          <li>Start typing to search posts.</li>
        </ul>
      </section>
    </main>
    <script src="/search.js"></script>
  </body>
</html>
